<!-- Diálogo de divergência: só aparece ao clicar em Vincular quando os valores não batem exato. -->
<p-dialog
  [modal]="true"
  appendTo="body"
  [closable]="true"
  [style]="{ width: '32rem' }"
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [header]="'conciliation.manualBankReconciliation.divergenceDialogTitle' | translate"
>
  <p class="text-sm mb-3">{{ message }}</p>
  <div class="flex flex-column gap-1 mb-3">
    <label class="text-xs font-medium text-color-secondary">
      {{ 'conciliation.manualBankReconciliation.divergenceReasonLabel' | translate }}
    </label>
    <p-select
      class="w-full"
      appendTo="body"
      [options]="divergenceReasonPresetOptions()"
      [ngModel]="selectedDivergenceReasonPreset()"
      (ngModelChange)="onPresetChange($event)"
      [placeholder]="
        'conciliation.manualBankReconciliation.divergenceReasonSelectPlaceholder' | translate
      "
    ></p-select>
  </div>
  @if (selectedDivergenceReasonPreset() === OTHER_DIVERGENCE_REASON) {
    <div class="flex flex-column gap-1">
      <textarea
        [rows]="3"
        pInputTextarea
        [autoResize]="false"
        class="w-full text-sm"
        [ngModel]="divergenceReason()"
        (ngModelChange)="divergenceReason.set($event)"
        [placeholder]="
          'conciliation.manualBankReconciliation.divergenceReasonPlaceholder' | translate
        "
      ></textarea>
    </div>
  }
  <ng-template pTemplate="footer">
    <p-button
      [outlined]="true"
      severity="secondary"
      (onClick)="onCancel()"
      [label]="'common.cancel' | translate"
    ></p-button>
    <p-button
      severity="warn"
      icon="pi pi-link"
      [loading]="reconciling"
      (onClick)="onConfirm()"
      [disabled]="!divergenceReason().trim()"
      [label]="'conciliation.manualBankReconciliation.link' | translate"
    ></p-button>
  </ng-template>
</p-dialog>
