<cs-page-header
  [compact]="false"
  [subtitle]="subtitleKey() | translate"
  [breadcrumb]="[
    { label: ('breadcrumb.dashboard.title' | translate), url: '/' },
    { label: ('breadcrumb.conciliation.title' | translate), url: '/conciliation' },
    { label: 'routes.conciliation.erpVsAcquirer.title' | translate },
  ]"
>
  <a
    pButton
    [routerLink]="[]"
    [replaceUrl]="true"
    queryParamsHandling="merge"
    [queryParams]="{ view: 'missing-acquirer' }"
    icon="pi pi-exclamation-circle"
    class="p-button-sm"
    [class.p-button-outlined]="activeTab() !== 'missingAcquirer'"
    [label]="'conciliation.action.missingAcquirer' | translate"
  ></a>

  <a
    pButton
    [routerLink]="[]"
    [replaceUrl]="true"
    queryParamsHandling="merge"
    [queryParams]="{ view: 'missing-erp' }"
    icon="pi pi-plus-circle"
    class="p-button-sm"
    [class.p-button-outlined]="activeTab() !== 'missingErp'"
    [label]="'conciliation.action.missingErp' | translate"
  ></a>

  <a
    pButton
    [routerLink]="[]"
    [replaceUrl]="true"
    queryParamsHandling="merge"
    [queryParams]="{ view: 'other-divergences' }"
    icon="pi pi-search"
    class="p-button-sm"
    [class.p-button-outlined]="activeTab() !== 'otherDivergences'"
    [label]="'conciliation.action.missingOther' | translate"
  ></a>

  <button
    pButton
    type="button"
    (click)="refresh()"
    icon="pi pi-refresh"
    class="p-button-text p-button-sm"
    [label]="'common.update' | translate"
  ></button>
</cs-page-header>

@switch (activeTab()) {
  @case ('missingAcquirer') {
    <app-missing-acquirer-list />
  }
  @case ('missingErp') {
    <app-missing-erp-list />
  }
  @case ('otherDivergences') {
    <cs-erp-vs-acquirer-other-divergences-list />
  }
}
